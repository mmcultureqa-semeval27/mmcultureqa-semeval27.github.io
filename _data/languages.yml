# Single source of truth for the language tracks.
# Rendered as the showcase on the home page and as the track list on /tasks/.
# native: the language's own name in its own script. script: drives the font stack.
# available: true once the track's data is on Hugging Face; everything else is coming soon.
# splits: what is released for an available track.
